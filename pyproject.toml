[project]
name = "medllmbot"
version = "0.2.0"
description = "Telegram assistant on aiogram 3 and Claude (Anthropic API) for a dental clinic or an electronics shop, with a web admin"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31,<4",
    "aiosqlite>=0.21",
    "alembic>=1.20.1",
    "anthropic>=2.7,<3",
    "fastapi>=0.162.2",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.33",
    "sqladmin[i18n]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 126
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
    # Russian text in strings and comments is not an error
    "RUF001",
    "RUF002",
    "RUF003",
    # ruff format handles line length; long string literals and comments are not an error
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# SQLAdmin is configured through mutable class attributes; that is its API
"medllmbot/admin/views.py" = ["RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.basedpyright]
# The uv environment, so the IDE and CLI see the same installed packages
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "recommended"
include = ["medllmbot", "evals", "tests"]
exclude = ["**/__pycache__", ".venv"]
# Disabled rules that catch no bugs and only demand noise in the code:
# `_ = await session.execute(...)` on every call and the ban on implicit concatenation of long strings
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
executionEnvironments = [
    # Mocks (AsyncMock) return Any by nature; in tests that is not an error
    { root = "tests", extraPaths = ["."], reportAny = false },
    { root = "." },
]

