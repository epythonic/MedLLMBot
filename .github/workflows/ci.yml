name: CI

# В main изменения попадают только через PR (защита ветки на GitHub). Проверки идут на каждом PR,
# а после слияния в main те же проверки и затем деплой на демо-сервер.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Версия Python — из .python-version (3.14, как в Docker-образе)
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run basedpyright

      - name: Tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t medllmbot .

  # Ключи демо-сервера из GitHub Environment «demo» (Settings → Environments → demo):
  # секреты TG_TOKEN, ADMIN_ID, ANTHROPIC_API_KEY, ADMIN_PASSWORD, ADMIN_SECRET_KEY и переменная ADMIN_USERNAME.
  # Job проверяет, что все ключи заданы и проходят валидацию настроек; значения в лог не попадают.
  # Тестам ключи не нужны — Anthropic и Telegram в них подменены фейками.
  # Запускается только перед деплоем (после слияния в main): PR не блокируются, пока секреты не заведены.
  # Деплой включается переменной репозитория DEPLOY_ENABLED=true, когда сервер и секреты готовы.
  config:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [test, docker]
    environment: demo
    env: &app_keys
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME || 'admin' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
      ADMIN_HTTPS_ONLY: "true"
      DOMAIN: ${{ vars.DOMAIN }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Check keys
        run: uv run python -m medllmbot.check_config

  # Деплой на демо-сервер: только после слияния PR в main и только если все проверки зелёные.
  # Секреты окружения «demo»: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (закрытый ключ CI),
  # DEPLOY_KNOWN_HOSTS (вывод ssh-keyscan сервера — без него подключение не пройдёт). Настройка — в README_ru.md.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: config
    runs-on: ubuntu-latest
    environment: demo
    # Два слияния подряд разворачиваются по очереди, а не одновременно
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps:
      - name: Build .env from secrets
        env: *app_keys
        # Значения в одинарных кавычках: и docker compose, и pydantic читают их как есть, без подстановки «$…»
        run: |
          umask 077
          for name in TG_TOKEN ADMIN_ID ANTHROPIC_API_KEY ADMIN_USERNAME ADMIN_PASSWORD ADMIN_SECRET_KEY ADMIN_HTTPS_ONLY DOMAIN; do
            value="${!name}"
            if [[ "$value" == *"'"* || "$value" == *$'\n'* ]]; then
              echo "::error::$name содержит одинарную кавычку или перевод строки" >&2
              exit 1
            fi
            printf "%s='%s'\n" "$name" "$value"
          done > "$RUNNER_TEMP/demo.env"

      - name: Deploy to demo server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Команду не передаём: на сервере ключ привязан к deploy/deploy.sh; .env уходит через stdin
          ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" < "$RUNNER_TEMP/demo.env"
