name: CI

# Changes reach main only through a PR (branch protection on GitHub). Checks run on every PR,
# and after a merge into main the same checks run, followed by a deploy to the demo server.
# A manual run on main (Actions → CI → Run workflow, or gh workflow run ci.yml --ref main) redeploys without
# a code change, for example after a secret of the «demo» environment was changed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Python version comes from .python-version (3.14, as in the Docker image)
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run basedpyright

      - name: Tests
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t medllmbot .

  # Demo server keys from the GitHub Environment «demo» (Settings → Environments → demo):
  # secrets TG_TOKEN, ADMIN_ID, ANTHROPIC_API_KEY, ADMIN_PASSWORD, ADMIN_SECRET_KEY and variable ADMIN_USERNAME;
  # how the admin is published: variable COMPOSE_PROFILES (tunnel or https, https by default) with secret
  # TUNNEL_TOKEN or variable DOMAIN.
  # The job checks that all keys are set and pass settings validation; values do not reach the log.
  # Tests do not need the keys: Anthropic and Telegram are replaced with fakes there.
  # Runs only before a deploy (after a merge into main): PRs are not blocked until the secrets are set up.
  # Deploy is enabled by the repository variable DEPLOY_ENABLED=true once the server and secrets are ready.
  config:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [test, docker]
    environment: demo
    env: &app_keys
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME || 'admin' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
      ADMIN_HTTPS_ONLY: "true"
      COMPOSE_PROFILES: ${{ vars.COMPOSE_PROFILES || 'https' }}
      TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
      DOMAIN: ${{ vars.DOMAIN }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Check keys
        run: uv run python -m medllmbot.check_config

  # Deploy to the demo server: only after a PR is merged into main (or a manual run on main)
  # and only if all checks are green.
  # Secrets of the «demo» environment: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (CI private key),
  # DEPLOY_KNOWN_HOSTS (ssh-keyscan output of the server; the connection fails without it). Setup: README_ru.md.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: config
    runs-on: ubuntu-latest
    environment: demo
    # Two merges in a row are deployed one after another, not at the same time
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps:
      - name: Build .env from secrets
        env: *app_keys
        # Values in single quotes: both docker compose and pydantic read them as is, without «$…» substitution
        run: |
          umask 077
          for name in TG_TOKEN ADMIN_ID ANTHROPIC_API_KEY ADMIN_USERNAME ADMIN_PASSWORD ADMIN_SECRET_KEY ADMIN_HTTPS_ONLY \
              COMPOSE_PROFILES TUNNEL_TOKEN DOMAIN; do
            value="${!name}"
            if [[ "$value" == *"'"* || "$value" == *$'\n'* ]]; then
              echo "::error::$name contains a single quote or a newline" >&2
              exit 1
            fi
            printf "%s='%s'\n" "$name" "$value"
          done > "$RUNNER_TEMP/demo.env"

      - name: Deploy to demo server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # No command is passed: on the server the key is bound to deploy/deploy.sh; .env goes via stdin
          ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" < "$RUNNER_TEMP/demo.env"
