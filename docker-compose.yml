x-app: &app
  build: .
  image: medllmbot
  env_file: .env
  volumes:
    - bot-storage:/app/storage

services:
  # The DB schema is upgraded before the bot and admin start. They also run upgrade on startup,
  # but by then there is nothing left to upgrade, so two processes never migrate the DB at once
  migrate:
    <<: *app
    command: ["python", "-m", "medllmbot.db.migrate"]

  bot:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  admin:
    <<: *app
    command: ["python", "-m", "medllmbot.admin"]
    environment:
      ADMIN_HOST: 0.0.0.0
      # Trust X-Forwarded-For / -Proto from Caddy: otherwise all logins come "from one address"
      # (brute-force protection would lock everyone out), and links would point to http://
      FORWARDED_ALLOW_IPS: "*"
    # The admin is reachable only from this machine; from outside, via a reverse proxy with HTTPS
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login')"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Check more often right after start: the deploy waits for the healthy status
      start_period: 30s
      start_interval: 2s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Demo server only: docker compose --profile https up -d (needs DOMAIN in .env)
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - admin
    restart: unless-stopped

volumes:
  bot-storage:
  caddy-data:
  caddy-config:
